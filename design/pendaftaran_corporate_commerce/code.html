<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Buat Akun Baru - ShopSmart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

                        "on-secondary-fixed-variant": "#005049",
                        "on-error-container": "#93000a",

                        "inverse-on-surface": "#eaf1ff",
                        "on-secondary-container": "#006f66",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#3755c3",
                        "inverse-surface": "#233144",
                        "on-tertiary-container": "#b9bcbe",
                        "on-primary-container": "#a8b8ff",
                        "primary": "#00288e",
                        "surface-container-highest": "#d5e3fc",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#d5e3fc",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#dde1ff",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#173bab",
                        "surface-dim": "#ccdbf3",
                        "on-secondary-fixed": "#00201d",
                        "inverse-primary": "#b8c4ff",
                        "on-tertiary-fixed-variant": "#444749",
                        "on-primary": "#ffffff",
                        "primary-container": "#1e40af",
                        "on-surface-variant": "#444653",
                        "secondary-fixed-dim": "#6bd8cb",
                        "surface": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "secondary": "#006a61",
                        "background": "#f8f9ff",
                        "on-error": "#ffffff",
                        "tertiary": "#323537",
                        "tertiary-container": "#484c4e",
                        "surface-bright": "#f8f9ff",
                        "outline": "#757684",
                        "outline-variant": "#c4c5d5",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "lg": "40px",
                        "sm": "16px",
                        "base": "4px",
                        "xl": "64px",
                        "container-max": "1280px",
                        "xs": "8px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {

                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .ambient-shadow-1 {
            box-shadow: 0 2px 4px rgba(30, 64, 175, 0.05);
        }
        .ambient-shadow-2 {
            box-shadow: 0 10px 15px rgba(30, 64, 175, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center py-lg px-sm">
<!-- Register Card Container -->
<main class="w-full max-w-[480px] bg-surface rounded-xl ambient-shadow-2 p-md md:p-lg">
<!-- Header -->
<header class="text-center mb-lg">
<h1 class="font-headline-md text-headline-md text-primary mb-xs">ShopSmart</h1>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Buat Akun Baru</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Mulai pengalaman berbelanja terbaik Anda hari ini.</p>
</header>
<!-- Register Form -->
<form action="#" class="space-y-sm" method="POST">
<!-- Nama Lengkap -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Nama Lengkap</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all ambient-shadow-1 font-body-md text-body-md text-on-surface" id="fullName" name="fullName" placeholder="Masukkan nama lengkap" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all ambient-shadow-1 font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="contoh@email.com" required="" type="email"/>
</div>
</div>
<!-- Nomor Telepon -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="phone">Nomor Telepon</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-outline">phone</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all ambient-shadow-1 font-body-md text-body-md text-on-surface" id="phone" name="phone" placeholder="081234567890" required="" type="tel"/>
</div>
</div>
<!-- Kata Sandi -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all ambient-shadow-1 font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="Minimal 8 karakter" required="" type="password"/>
<button class="absolute right-sm top-1/2 transform -translate-y-1/2 text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Konfirmasi Kata Sandi -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="confirmPassword">Konfirmasi Kata Sandi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all ambient-shadow-1 font-body-md text-body-md text-on-surface" id="confirmPassword" name="confirmPassword" placeholder="Ulangi kata sandi" required="" type="password"/>
</div>
</div>
<!-- Syarat dan Ketentuan -->
<div class="flex items-start gap-xs mt-sm">
<div class="flex items-center h-5">
<input class="w-[18px] h-[18px] rounded border-outline-variant text-primary focus:ring-primary-fixed focus:ring-2 bg-surface-container-lowest transition-colors cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="terms">
                    Saya setuju dengan <a class="text-primary hover:underline font-label-md text-label-md" href="#">Syarat dan Ketentuan</a> serta <a class="text-primary hover:underline font-label-md text-label-md" href="#">Kebijakan Privasi</a>.
                </label>
</div>
<!-- Submit Button -->
<button class="w-full mt-md bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-sm rounded-lg transition-colors duration-200 ambient-shadow-1 flex justify-center items-center gap-xs" type="submit">
                Daftar Sekarang
            </button>
</form>
<!-- Divider -->
<div class="flex items-center my-md">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="mx-sm font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">atau</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<div class="space-y-sm">
<button class="w-full flex items-center justify-center gap-sm py-[14px] px-sm bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors duration-200 font-label-md text-label-md text-on-surface ambient-shadow-1" type="button">
<img alt="Google" class="w-5 h-5 object-contain" data-alt="Google G Logo, simple flat design, official brand colors, isolated on white background, sharp vector style illustration" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFfGjDjYgVS4XP0UFEH7KwWJCvwWJ-NvSYQoEBYjQxJurJeIDJgnZhDrgc8SqzemszFUJv-vk23kNfgWbYNHarPyzaKvfJ36okoAk_oVQsq-5LhC71uq6wQC_CVcQVB6riWH-EWbg0zJ8-zRCuNCCSg8xZfz10RC9HvC3K42ol6qEPVG0Chy4WHKp2_JQI_7X6D5zL8849nMKTmtr9QDtUdE5hTHZqHv0uxNal86UxKpj4amWOvsmn"/>
                Daftar dengan Google
            </button>
<button class="w-full flex items-center justify-center gap-sm py-[14px] px-sm bg-[#1877F2] hover:bg-[#166FE5] text-white rounded-lg transition-colors duration-200 font-label-md text-label-md ambient-shadow-1 border border-transparent" type="button">
<img alt="Facebook" class="w-5 h-5 object-contain" data-alt="Facebook 'f' Logo in white, simple flat design, transparent background, sharp vector style illustration" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAdy_OICvAe3qlqB-SwnTRoCbzyz-rFVoKAq3RMopK4ChCCxyiCOUz9--AMknvU5_r_rSdeIKyKjlA5W12J9tMd6n1YfZTa_H-6ngAyW2SyhWDOFv1OsA7lPl8CFBHiwT7vCDXw4mbXmPQfilxPNn58hniu2x77PqiiZrydu4WWvUBBFWilo75D3t1uMUIxY0g87iE0jdKP4KKjdTU93lmPu8WcNdtvnZwbUKrLoLDdcTHa8fgrZMja"/>
                Daftar dengan Facebook
            </button>
</div>
<!-- Login Link -->
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Sudah punya akun? <a class="text-primary font-label-md text-label-md hover:underline" href="#">Masuk di sini</a>
</p>
</div>
</main>
</body></html>
