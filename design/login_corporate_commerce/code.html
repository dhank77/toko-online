<!DOCTYPE html>

<html lang="en"><head>

                        "surface-variant": "#d5e3fc",
                        "surface-container-lowest": "#ffffff",

<style>
        .bg-login-pattern {
            background-image: radial-gradient(circle at 100% 100%, #e6eeff 0, transparent 50%), 
                              radial-gradient(circle at 0 0, #dce9ff 0, transparent 50%);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased bg-login-pattern">
<!-- TopAppBar Semantic Shell Suppressed - Linear/Transactional Intent (Login) -->
<main class="flex-grow flex items-center justify-center p-sm md:p-gutter">
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_10px_15px_rgba(30,64,175,0.1)] p-lg flex flex-col relative overflow-hidden">
<!-- Brand & Header -->
<div class="text-center mb-xl relative z-10">
<h1 class="font-headline-md text-headline-md text-primary mb-sm font-bold tracking-tight">ShopSmart</h1>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Selamat Datang Kembali</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Silakan masuk ke akun Anda.</p>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-sm relative z-10" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">mail</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md placeholder-outline-variant" id="email" name="email" placeholder="nama@email.com" required="" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Lupa Kata Sandi?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">lock</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary py-sm rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors mt-xs flex items-center justify-center gap-xs" type="submit">
                    Masuk
                </button>
</form>
<!-- Divider -->
<div class="flex items-center my-md relative z-10">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-sm font-label-sm text-label-sm text-outline">ATAU</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<div class="flex flex-col gap-sm relative z-10">
<button class="w-full border border-outline-variant bg-surface text-on-surface py-sm rounded-lg font-label-md text-label-md hover:bg-surface-variant transition-colors flex items-center justify-center gap-sm" type="button">
<img alt="Google" class="w-5 h-5 object-contain" data-alt="A highly detailed illustration of a generic colorful 'G' logo resembling Google's style, set against a pristine white background. High-key lighting, modern corporate minimalism, flat design aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-JGEgb_6T_4y0vGX7GK_qrVUKCc_mmGhOKLaY4e5-Sj-I_ZSn7tvhtPcjrumnZSw1_th9dAZZtNcsq5dEU4KYoBK0e01UqNs_0P7NIaqkQhaWBzU6wyozR2eeYtPXrokUipQRugz4ENQQmFrPfg-m4dQQZnkhdM7ROZRVaFUvcZOhW-LNMUoQtSlHmsaxzXsbyUd4RTBr-hieKMlmOs6K_bRpmfactYNUNvTAP4fGKGaLDlomVyPv"/>
                    Masuk dengan Google
                </button>
<button class="w-full border border-outline-variant bg-surface text-on-surface py-sm rounded-lg font-label-md text-label-md hover:bg-surface-variant transition-colors flex items-center justify-center gap-sm" type="button">
<img alt="Facebook" class="w-5 h-5 object-contain" data-alt="A highly detailed illustration of a generic blue 'F' logo resembling Facebook's style, set against a pristine white background. High-key lighting, modern corporate minimalism, flat design aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCu2WtGmMi1eLp_bS02YGENbbBV_SK2J5AI_y4IqLerSO5fdAPp1m0Olfq_APcc0SEAsZS2VfO6M6HNYdep6GbYD-C-b7U8Z7_A4BWPuHW0CFDENmmrChDnn9cVyd_OYsy_RZgc53lQw1mWFXjh2nAqIIDrAodpKtu8Pla-toocGtzQxBg0oP3AMGL-JG6WWJHeds12VExsRl1I245V4UUVVEW12e2oA845MkSIAgaPblihWv5GYIDY"/>
                    Masuk dengan Facebook
                </button>
</div>
<!-- Register Link -->
<div class="mt-lg text-center font-body-sm text-body-sm text-on-surface-variant relative z-10">
                Belum punya akun? <a class="font-label-md text-label-md text-primary hover:underline" href="#">Daftar di sini</a>
</div>
</div>
</main>
<!-- Footer Semantic Shell Suppressed - Linear/Transactional Intent (Login) -->
</body></html>
